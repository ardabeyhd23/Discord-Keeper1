name: Hayatta Tut

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Oluşturucu
        run: |
          for i in 1 2 3; do
            echo "Ping denemesi: $i"

            if curl -f -L --max-time 30 https://discord-keeper1.onrender.com/health; then
              echo "Health endpoint başarılı."
              exit 0
            fi

            echo "Cevap alınamadı, 10 saniye sonra tekrar denenecek..."
            sleep 10
          done

          echo "3 denemede de cevap alınamadı."
          exit 1
