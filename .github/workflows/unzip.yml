name: Extract project ZIP

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: ZIP'i aç
        run: |
          mkdir -p extracted
          unzip -o *.zip -d extracted

      - name: Dosyaları ana dizine taşı
        run: |
          cp -r extracted/* ./
          rm -rf extracted
          rm -f *.zip

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract project ZIP" || echo "Değişiklik yok"
          git push
