name: Depoyu Temizle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temizle:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Workflow klasörü dışındaki dosyaları sil
        shell: bash
        run: |
          # .github/workflows klasörünü koru
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

          # .github içindeki workflows dışındaki şeyleri sil
          find .github -mindepth 1 -maxdepth 1 \
            ! -name "workflows" \
            -exec rm -rf {} +

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Depoyu temizle" || echo "Değişiklik yok"
          git push
