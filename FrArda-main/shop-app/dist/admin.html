<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FRArda • Mağaza Yönetimi</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#f5f2ff;background:#090812}
    *{box-sizing:border-box}body{max-width:1180px;margin:0 auto;padding:28px;background:radial-gradient(700px 400px at 80% 0,#30205e55,transparent),#090812;min-height:100vh}
    header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #ffffff18;padding-bottom:22px}
    h1{margin:0;font-size:25px}p,small{color:#9f9aad}.stats{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.stat,table{background:#151322;border:1px solid #ffffff12;border-radius:14px}.stat{padding:17px 20px;min-width:150px}.stat b{display:block;font-size:24px;margin-top:5px}
    .campaign{padding:15px 18px;border-radius:12px;background:#173b2a;border:1px solid #2b9d64;margin-bottom:20px}
    table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden}th,td{text-align:left;padding:14px;border-bottom:1px solid #ffffff0c;font-size:13px}th{color:#aaa0c2;font-size:11px;text-transform:uppercase;letter-spacing:1px}tr:last-child td{border:0}.user{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:#6944c9;object-fit:cover;display:grid;place-items:center;font-size:11px}
    .muted{color:#777184}button{background:#7143e1;color:white;border:0;padding:10px 14px;border-radius:9px;cursor:pointer}#error{color:#ff8e9b;margin-top:40px}
    @media(max-width:650px){body{padding:18px}header{align-items:flex-start;flex-direction:column}table{display:block;overflow:auto;white-space:nowrap}}
  </style>
</head>
<body>
  <header><div><h1>FRArda • Mağaza Yönetim Paneli</h1><p>Mağazaya giriş yapan kullanıcılar ve siparişler</p></div><button onclick="location.href='/shop/'">Mağazaya dön</button></header>
  <div id="error"></div><main id="panel" hidden><section class="stats"><div class="stat">Giriş yapan kullanıcı<b id="count">0</b></div><div class="stat">Aktif sipariş<b id="orders">0</b></div><div class="stat">Kampanya<b id="campaign">Yok</b></div></section><div id="campaignBox"></div><table><thead><tr><th>Kullanıcı</th><th>Kullanıcı adı</th><th>Discord ID</th><th>Coin</th><th>Son giriş</th></tr></thead><tbody id="users"></tbody></table></main>
  <script>
    const token=localStorage.getItem("fr_shop_session")||sessionStorage.getItem("fr_shop_session");
    const headers=token?{Authorization:"Bearer "+token}:{};
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    fetch("/api/shop/admin",{headers}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error);return data}).then(data=>{
      panel.hidden=false;count.textContent=data.users.length;orders.textContent=data.orders.filter(o=>o.status==="devam-ediyor").length;campaign.textContent=data.activeCampaign?`%${data.activeCampaign.discount}`:"Yok";
      if(data.activeCampaign)campaignBox.innerHTML=`<div class="campaign">🟢 Aktif kampanya: <b>%${esc(data.activeCampaign.discount)} indirim</b> · Bitiş: ${new Date(data.activeCampaign.expiresAt).toLocaleString("tr-TR")}</div>`;
      users.innerHTML=data.users.map(u=>`<tr><td><div class="user">${u.avatar?`<img class="avatar" src="${esc(u.avatar)}">`:`<span class="avatar">FR</span>`}<b>${esc(u.displayName)}</b></div></td><td>${esc(u.username)}</td><td class="muted">${esc(u.id)}</td><td><b>${Number(u.coins).toLocaleString("tr-TR")}</b></td><td class="muted">${u.lastLoginAt?new Date(u.lastLoginAt).toLocaleString("tr-TR"):"-"}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">Henüz mağazaya giriş yapan kullanıcı yok.</td></tr>`;
    }).catch(()=>error.textContent="⚠️ Bu sayfaya erişim yetkin yok.");
  </script>
</body>
</html>
