openapi: 3.0.3
info:
  title: FR Family Shop API
  version: 1.0.0
paths:
  /api/shop/auth/discord:
    get:
      summary: Start Discord OAuth login
      responses:
        '302': { description: Redirect to Discord OAuth }
  /api/shop/auth/callback:
    get:
      summary: Discord OAuth callback
      responses:
        '302': { description: Redirect back to shop }
  /api/shop/catalog:
    get:
      summary: Get the authenticated user's real FR Family Shop catalog and balance
      responses:
        '200': { description: Catalog returned }
        '401': { description: Discord login required }
  /api/shop/purchase:
    post:
      summary: Create a real FR Family Shop order and deduct coins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string }
      responses:
        '200': { description: Order created }
        '400': { description: Insufficient balance }
        '401': { description: Discord login required }
        '404': { description: Product not found }
