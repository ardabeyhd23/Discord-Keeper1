services:
  - type: web
    name: frarda-bot
    runtime: node
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_MODERATION_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        sync: false
      - key: WELCOME_DM_ENABLED
        value: "true"
      - key: SUGGESTION_CHANNEL_ID
        sync: false
      - key: FRARDA_OWNER_ID
        sync: false
      - key: DISCORD_CLIENT_ID
        value: "1535760848407232603"
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: FR_SHOP_ACTIVITY_URL
        sync: false
      - key: FR_SHOP_OAUTH_REDIRECT_URI
        sync: false
      - key: FR_SHOP_ACTIVITY_ENABLED
        value: "true"
      - key: FR_SHOP_ACTIVITY_MODE
        value: "activity"
      - key: VITE_DISCORD_CLIENT_ID
        sync: false
      - key: FR_SHOP_GUILD_ID
        sync: false
      - key: SHOP_DATA_DIR
        value: /var/data
    disk:
      name: frarda-shop-data
      mountPath: /var/data
      sizeGB: 1
