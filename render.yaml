services:
  - type: web
    name: frarda-bot
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: GROQ_MODERATION_MODEL
        value: llama-3.3-70b-versatile
      - key: WELCOME_DM_ENABLED
        value: "true"
      - key: SUGGESTION_CHANNEL_ID
        sync: false
      - key: FRARDA_OWNER_ID
        sync: false
      - key: SHOP_DATA_DIR
        value: /var/data
    disk:
      name: frarda-shop-data
      mountPath: /var/data
      sizeGB: 1
