services:
  - type: web
    name: fr-family-shop
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/shop-app run build
    startCommand: pnpm --filter @workspace/shop-app run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        sync: false
